[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hunch-kit"
version = "0.1.0"
description = "Structured experimentation for iterative creative workflows. Test your hunches."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "earlyprototype"},
]
keywords = ["experimentation", "evaluation", "prompt-engineering", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
llm = [
    "google-genai>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hunch = "hunch_kit.cli:cli"

[project.urls]
Homepage = "https://github.com/earlyprototype/hunch_kit"
Repository = "https://github.com/earlyprototype/hunch_kit"
Issues = "https://github.com/earlyprototype/hunch_kit/issues"

[tool.setuptools.packages.find]
include = ["hunch_kit*", "hunch_kit_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
